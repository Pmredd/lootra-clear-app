name: Build Signed AAB

on:
  workflow_dispatch:

jobs:
  build-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Check Android project
        run: |
          if [ ! -f "gradlew" ]; then
            echo "The Gradle wrapper was not found in the repository root."
            exit 1
          fi

          chmod +x gradlew

      - name: Remove stale Gradle project cache
        run: |
          rm -rf .gradle
          find . -type d -name build -prune -exec rm -rf {} +

      - name: Check required secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Missing secret: ANDROID_KEYSTORE_BASE64"
            exit 1
          fi

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "Missing secret: ANDROID_KEYSTORE_PASSWORD"
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "Missing secret: ANDROID_KEY_ALIAS"
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "Missing secret: ANDROID_KEY_PASSWORD"
            exit 1
          fi

      # ------------------------------------------------------------------
      # IMPORTANT: This step DECODES the SAME keystore every time.
      # It never generates a new one. This is the fix for the key
      # mismatch issue — the same upload key must be reused for every
      # single release, forever.
      # ------------------------------------------------------------------
      - name: Decode upload keystore from secret
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > upload-keystore.jks

          if [ ! -s "upload-keystore.jks" ]; then
            echo "Failed to decode keystore from secret."
            exit 1
          fi

      - name: Verify upload keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          keytool -list \
            -keystore upload-keystore.jks \
            -storepass "$KEYSTORE_PASSWORD"

      - name: Export signing path
        run: |
          echo "ANDROID_KEYSTORE_PATH=$GITHUB_WORKSPACE/upload-keystore.jks" >> "$GITHUB_ENV"

      - name: Build signed release AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --stacktrace --no-daemon

      - name: Find and verify AAB
        id: find_aab
        shell: bash
        run: |
          AAB_PATH=$(find . -type f -path "*/build/outputs/bundle/release/*.aab" | head -n 1)

          if [ -z "$AAB_PATH" ]; then
            echo "No release AAB was found."
            exit 1
          fi

          echo "AAB generated successfully:"
          ls -lh "$AAB_PATH"

          echo "aab_path=$AAB_PATH" >> "$GITHUB_OUTPUT"

      # NOTE: We no longer upload the keystore or its base64 file as an
      # artifact. The keystore only ever needs to exist as the
      # ANDROID_KEYSTORE_BASE64 secret — uploading it as a build artifact
      # is an unnecessary security risk.
      - name: Upload signed AAB package
        uses: actions/upload-artifact@v4
        with:
          name: Signed-AAB-Package
          path: |
            ${{ steps.find_aab.outputs.aab_path }}
          if-no-files-found: error
          retention-days: 7
