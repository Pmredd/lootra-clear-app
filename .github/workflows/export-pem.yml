name: Export PEM Certificate

on:
  workflow_dispatch:
    inputs:
      keystore_password:
        description: "The keystore password"
        required: true
        type: string

jobs:
  export-pem:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Decode keystore from secret
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > upload-keystore.jks

          if [ ! -s "upload-keystore.jks" ]; then
            echo "ERROR: Failed to decode keystore. The ANDROID_KEYSTORE_BASE64 secret may be empty or invalid."
            exit 1
          fi

          echo "Keystore file size:"
          ls -lh upload-keystore.jks

      - name: Show full keystore listing (for visibility)
        run: |
          keytool -list -keystore upload-keystore.jks -storepass "${{ inputs.keystore_password }}"

      - name: Detect alias and export PEM (combined)
        run: |
          echo "--- Keystore checksum ---"
          md5sum upload-keystore.jks

          echo "--- Full verbose listing ---"
          keytool -list -v -keystore upload-keystore.jks -storepass "${{ inputs.keystore_password }}" -storetype JKS

          ALIAS=$(keytool -list -v -keystore upload-keystore.jks -storepass "${{ inputs.keystore_password }}" -storetype JKS \
            | grep "^Alias name:" \
            | head -n 1 \
            | sed 's/^Alias name:[[:space:]]*//' \
            | tr -d '\r\n')

          echo "Detected alias: [$ALIAS]"
          echo -n "$ALIAS" | hexdump -C

          echo "--- Attempting export with -exportcert (modern command) ---"
          keytool -exportcert -rfc \
            -J-Duser.language=en -J-Duser.country=US \
            -storetype JKS \
            -keystore upload-keystore.jks \
            -alias "$ALIAS" \
            -storepass "${{ inputs.keystore_password }}" \
            -file upload_certificate.pem || {
              echo "--- exportcert also failed. Trying PKCS12 conversion fallback ---"
              keytool -importkeystore \
                -srckeystore upload-keystore.jks -srcstoretype JKS -srcstorepass "${{ inputs.keystore_password }}" \
                -destkeystore upload-keystore.p12 -deststoretype PKCS12 -deststorepass "${{ inputs.keystore_password }}"

              echo "--- PKCS12 listing ---"
              keytool -list -v -keystore upload-keystore.p12 -storetype PKCS12 -storepass "${{ inputs.keystore_password }}"

              P12_ALIAS=$(keytool -list -v -keystore upload-keystore.p12 -storetype PKCS12 -storepass "${{ inputs.keystore_password }}" \
                | grep "^Alias name:" | head -n 1 | sed 's/^Alias name:[[:space:]]*//' | tr -d '\r\n')
              echo "PKCS12 alias: [$P12_ALIAS]"

              keytool -exportcert -rfc \
                -storetype PKCS12 \
                -keystore upload-keystore.p12 \
                -alias "$P12_ALIAS" \
                -storepass "${{ inputs.keystore_password }}" \
                -file upload_certificate.pem
            }

          echo "PEM file created:"
          ls -lh upload_certificate.pem
          echo "--- PEM content ---"
          cat upload_certificate.pem

      - name: Upload PEM as artifact
        uses: actions/upload-artifact@v4
        with:
          name: upload-certificate-pem
          path: upload_certificate.pem
          if-no-files-found: error
          retention-days: 1
